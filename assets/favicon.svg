<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Favicon, not a shrunk mark.svg. At 16px the torso outline of the full
       mark collapses into grey mush, so this drops the body lines entirely and
       keeps only the spine — heavier stroke, fewer, larger vertebrae, on a
       solid tile so it holds up against both light and dark browser chrome. -->
  <rect width="64" height="64" rx="14" fill="#0E2140"/>
  <defs>
    <linearGradient id="f" x1="20" y1="10" x2="46" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#31C8FF"/>
      <stop offset="1" stop-color="#0F8FE0"/>
    </linearGradient>
  </defs>
  <path d="M38 12c4.4 5.2 5 11 1.6 16.6-2.6 4.2-2.6 7.4 0 11.6 3.4 5.6 3.6 10.4 0 15.8"
        stroke="url(#f)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="26" cy="22" r="4" fill="#E5AC2B"/>
  <circle cx="25" cy="34" r="4.4" fill="url(#f)"/>
  <circle cx="26.5" cy="46" r="4.8" fill="url(#f)"/>
</svg>
