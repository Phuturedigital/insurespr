<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" fill="none" role="img" aria-label="InsureSPR Health">
  <title>InsureSPR Health</title>
  <!-- Same geometry as mark.svg, re-pitched for dark grounds. The deep end of
       the brand gradient (#213F9A) sits only a shade off the ink background, so
       on the footer the bottom third of the primary mark disappears. This
       variant raises the whole ramp into the cyans and keeps the darkest stop
       well clear of the ground it sits on. -->
  <defs>
    <linearGradient id="sprSpineLight" x1="8" y1="4" x2="42" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FE0FF"/>
      <stop offset=".55" stop-color="#31C8FF"/>
      <stop offset="1" stop-color="#0F8FE0"/>
    </linearGradient>
  </defs>

  <path d="M30.5 4.5c4.6 4.1 5.6 9.4 3 14.6-2.4 4.8-2.9 8.2-.4 12.3 3.4 5.6 4 10.2 1.6 15.4-1.9 4.1-2.2 7.4-.9 11.7"
        stroke="url(#sprSpineLight)" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M17.5 12.2c-4.7 3.3-7.3 8-7.6 13.7-.2 4.6 1 8.4 3.6 12.3 2.4 3.6 3.3 7 2.8 10.8"
        stroke="url(#sprSpineLight)" stroke-width="2.6" stroke-linecap="round" opacity=".6"/>

  <circle cx="24.6" cy="21.4" r="2.35" fill="url(#sprSpineLight)"/>
  <circle cx="23.9" cy="29.3" r="2.55" fill="url(#sprSpineLight)"/>
  <circle cx="24.4" cy="37.4" r="2.75" fill="url(#sprSpineLight)"/>
  <circle cx="25.4" cy="45.6" r="2.95" fill="url(#sprSpineLight)"/>
  <circle cx="26.2" cy="53.9" r="3.1" fill="url(#sprSpineLight)"/>
</svg>
