<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage a booking — InsureSPR Precision Healthcare</title><meta name="robots" content="noindex, nofollow"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap"><link rel="stylesheet" href="styles.css?v=20260812d"></head><body><a class="skip" href="#main">Skip to content</a><div class="nav-shell"><div class="wrap"><nav class="nav"><a class="brand" href="index.html"><img src="assets/mark.svg" alt="" width="34" height="34"><span><span class="brand-name">Insure<span>SPR</span></span><span class="brand-sub">Precision Healthcare</span></span></a><a class="btn btn--ghost btn--sm" href="contact.html">Contact</a></nav></div></div><main id="main"><section><div class="wrap narrow"><div class="card"><p class="eyebrow eyebrow--plain">Manage booking</p><h1>Cancel or request a different time</h1><p>A reschedule request is not a newly confirmed appointment. Staff still need to confirm the replacement.</p><form id="manage-booking-form" novalidate><div class="hp-field" aria-hidden="true"><label for="mwebsite">Website</label><input id="mwebsite" name="website" tabindex="-1" autocomplete="off"></div><input type="hidden" name="token"><div class="field"><label for="maction">What do you need?</label><select id="maction" name="action" required><option value="request_reschedule">Request a different time</option><option value="cancel">Cancel the booking</option></select></div><div class="field-row"><div class="field"><label for="mdate">Preferred new date <span class="optional">(for rescheduling)</span></label><input type="date" id="mdate" name="preferred_date"></div><div class="field"><label for="mperiod">Preferred time</label><select id="mperiod" name="preferred_time_period"><option value="any">Any</option><option value="morning">Morning</option><option value="afternoon">Afternoon</option></select></div></div><div class="field"><label for="mnote">Note <span class="optional">(optional)</span></label><textarea id="mnote" name="note" maxlength="500"></textarea></div><button class="btn btn--primary" type="submit">Submit booking change</button><div class="note" id="manage-booking-status" hidden style="margin-top:1rem"></div></form></div></div></section></main><script src="production.js?v=20260812d" defer></script></body></html>
